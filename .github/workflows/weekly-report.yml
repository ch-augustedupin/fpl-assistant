name: FPL report before each deadline
# Reports are never committed or printed here: the repo is public.

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 h; notify.py only sends once per GW, ~36 h before the deadline
  workflow_dispatch:
    inputs:
      force:
        description: "Send now even if not due / already sent"
        type: boolean
        default: false
      channels:
        description: "Channels to send (test one at a time)"
        default: "email,whatsapp"

permissions:
  contents: write

concurrency:
  group: fpl-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send the report if due
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python notify.py ${{ inputs.force && '--force' || '' }} --channels "${{ inputs.channels || 'email,whatsapp' }}"
      - name: Commit the sent marker (reports stay private: never committed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "sent: GW$(tail -1 state/sent.txt)" && git push)
